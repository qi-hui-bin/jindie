[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jindie"
version = "0.1.0"
description = "Local bank statement processing for Kingdee vouchers"
requires-python = ">=3.12"
dependencies = [
    "defusedxml==0.7.1",
    "Flask==3.1.3",
    "itsdangerous==2.2.0",
    "openpyxl==3.1.5",
    "waitress==3.0.2",
    "xlrd==2.0.2",
]

[tool.setuptools.packages.find]
include = ["jindie*"]

[tool.setuptools.package-data]
jindie = ["migrations/*.sql", "templates/*.html", "static/*.css"]
